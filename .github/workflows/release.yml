name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC). No NPM_TOKEN needed.
      id-token: write
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: 24
        registry-url: 'https://registry.npmjs.org'

    # Trusted publishing requires npm >= 11.5.1.
    - name: Update npm
      run: npm install -g npm@latest

    - name: Install
      run: npm ci

    - name: Build
      run: npm run build

    - name: Publish
      run: npm publish
