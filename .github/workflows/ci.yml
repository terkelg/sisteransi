name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Node.js v${{ matrix.nodejs }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nodejs: [22, 24]
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.nodejs }}

    - name: Install
      run: npm ci

    - name: Build
      run: npm run build

    - name: Test
      run: npm test

  dist:
    name: Built output on Node.js v20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: 20

    - name: Install
      run: npm ci

    - name: Build
      run: npm run build

    - name: Smoke test built output
      run: node scripts/smoke.js
